<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Entrar - Cuidado em Saúde</title>
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/login.css">
</head>
<body data-acesso="visitante">

  <header>
    <div class="container topo">
      <div class="tituloelogo">
        <img src="Imagens/Logo VivaBem Simples.png" alt="Logo da instituição" class="logo">
        <a href="index.html" class="nome">VivaBem — Centro de Cuidado Integral</a>
      </div>

      <nav>
        <a href="index.html">Início</a>
        <a href="login.html" class="ativo" data-mostrar="visitante">Entrar</a>
        <a href="cadastro.html" data-mostrar="visitante">Cadastrar</a>
        <a href="agendar.html" data-mostrar="logado">Agendar consulta</a>
        <a href="consultas.html" data-mostrar="logado">Minhas consultas</a>
        <a href="feedback.html" data-mostrar="logado">Feedback</a>
        <button id="botao-sair" data-mostrar="logado">Sair</button>
      </nav>
    </div>
  </header>

  <main class="container">
    <h1>Entrar</h1>

    <form id="form-login" class="formulario">
      <label for="email">E-mail</label>
      <input type="email" id="email">

      <label for="senha">Senha</label>
      <input type="password" id="senha">

      <p class="mensagem" id="mensagem"></p>
      <button type="submit" class="botao">Entrar</button>
    </form>

    <p>Ainda não tem conta? <a href="cadastro.html">Cadastre-se</a></p>
    <p class="aviso">Para testar: e-mail ana@exemplo.com e senha 123456.</p>
  </main>

  <footer>
    <div class="container footer">
      Instituição fictícia criada para um trabalho acadêmico.
    </div>
  </footer>

  <script src="js/db.js"></script>
  <script src="js/common.js"></script>
  <script src="js/login.js"></script>
</body>
</html>
